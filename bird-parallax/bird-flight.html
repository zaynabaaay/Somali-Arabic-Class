<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cbdce5">
  <title>Blue Bird · Flight Cycle</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17263d;
      --muted: #687584;
      --gold: #bf8628;
      --paper: #f7f3ea;
      --line: rgba(23, 38, 61, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }

    main {
      display: grid;
      min-height: 100svh;
      grid-template-columns: minmax(260px, .58fr) minmax(0, 1.42fr);
    }

    .intro {
      display: flex;
      padding: clamp(30px, 5vw, 76px);
      border-right: 1px solid var(--line);
      flex-direction: column;
      justify-content: space-between;
      gap: 48px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 7ch;
      margin: 0;
      font: 400 clamp(54px, 6vw, 96px)/.9 Georgia, serif;
      letter-spacing: -.055em;
    }

    .intro-copy {
      max-width: 33ch;
      margin: 24px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .links { display: flex; flex-wrap: wrap; gap: 12px 18px; }
    .links a {
      color: #235891;
      font-size: 14px;
      font-weight: 750;
      text-underline-offset: 4px;
    }

    .viewer {
      display: grid;
      min-width: 0;
      padding: clamp(16px, 3vw, 44px);
      overflow: hidden;
      background:
        radial-gradient(circle at 76% 20%, rgba(255,255,255,.9) 0 6%, transparent 6.4%),
        linear-gradient(150deg, #a9c7d6 0%, #dbe7e6 54%, #e9e1d2 100%);
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .stage {
      position: relative;
      display: grid;
      min-height: 0;
      place-items: center;
      isolation: isolate;
    }

    .cloud, .cloud::before, .cloud::after {
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.3);
      content: "";
      filter: blur(1px);
      z-index: -1;
    }

    .cloud {
      top: 20%;
      left: 8%;
      width: 170px;
      height: 30px;
    }
    .cloud::before { width: 80px; height: 60px; left: 34px; bottom: 0; }
    .cloud::after { width: 95px; height: 48px; left: 84px; bottom: 0; }

    .bird-wrap {
      width: min(84svh, 100%, 850px);
      animation: hover 1.15s ease-in-out infinite;
      transform-origin: 58% 58%;
      will-change: transform;
    }

    .bird-wrap.paused { animation-play-state: paused; }

    #bird-frame {
      display: block;
      width: 100%;
      max-height: 72svh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 23px 21px rgba(26, 52, 76, .14));
    }

    .phase {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 999px;
      color: #536777;
      background: rgba(255,255,255,.52);
      font-size: 12px;
      font-weight: 750;
      backdrop-filter: blur(12px);
    }

    .controls {
      display: grid;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 18px;
      background: rgba(249,248,244,.74);
      box-shadow: 0 14px 40px rgba(45, 52, 64, .09);
      grid-template-columns: auto minmax(130px, 1fr) auto;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(16px);
    }

    .play-button, select {
      min-height: 46px;
      border-radius: 12px;
      cursor: pointer;
    }

    .play-button {
      min-width: 112px;
      padding: 0 18px;
      color: white;
      border: 1px solid #17263d;
      background: #17263d;
      font-weight: 750;
    }

    select {
      padding: 0 36px 0 13px;
      color: var(--ink);
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
    }

    input[type="range"] {
      width: 100%;
      accent-color: #275f9e;
      cursor: grab;
    }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid rgba(39, 95, 158, .32);
      outline-offset: 2px;
    }

    @keyframes hover {
      0%, 100% { transform: translate3d(0, -5px, 0) rotate(-.35deg); }
      50% { transform: translate3d(0, 7px, 0) rotate(.35deg); }
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .intro {
        padding: 36px 22px 24px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      h1 { max-width: none; font-size: clamp(48px, 14vw, 76px); }
      .intro-copy { margin-top: 16px; }
      .viewer { min-height: 68svh; padding: 12px; }
      .bird-wrap { width: min(100%, 760px); }
      #bird-frame { max-height: 56svh; }
      .controls { grid-template-columns: auto minmax(0, 1fr); }
      select { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bird-wrap { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <div>
        <p class="eyebrow">Flight study · eight frames</p>
        <h1>Learning to fly.</h1>
        <p class="intro-copy">A complete wing cycle with a fixed body anchor. This is the animation layer we can later place on a curved flight path.</p>
      </div>
      <nav class="links" aria-label="Bird assets">
        <a href="bird-turnaround.html">View the 360° bird</a>
        <a href="flight/blue-bird-flight-sheet.png" download>Download flight sheet</a>
      </nav>
    </header>

    <section class="viewer" aria-label="Animated blue bird flight cycle">
      <div class="stage">
        <span class="phase" id="phase">Highest upstroke</span>
        <span class="cloud" aria-hidden="true"></span>
        <div class="bird-wrap" id="bird-wrap">
          <img id="bird-frame" src="flight/frames/bird-flight-000.png" alt="Blue and gold anime bird flapping in place">
        </div>
      </div>

      <div class="controls" aria-label="Flight animation controls">
        <button class="play-button" id="play" type="button" aria-pressed="true">Pause</button>
        <input id="scrubber" type="range" min="0" max="7" step="1" value="0" aria-label="Wing animation frame">
        <select id="speed" aria-label="Wing speed">
          <option value="190">Gentle</option>
          <option value="125" selected>Natural</option>
          <option value="78">Fast</option>
        </select>
      </div>
    </section>
  </main>

  <script>
    const frames = Array.from({ length: 8 }, (_, index) =>
      `flight/frames/bird-flight-${String(index).padStart(3, "0")}.png`
    );
    const phases = [
      "Highest upstroke", "High downstroke", "Mid downstroke", "Wings level",
      "Full downstroke", "Low recovery", "Rising", "Near upstroke"
    ];

    frames.forEach(source => { const image = new Image(); image.src = source; });

    const bird = document.querySelector("#bird-frame");
    const wrap = document.querySelector("#bird-wrap");
    const phase = document.querySelector("#phase");
    const scrubber = document.querySelector("#scrubber");
    const playButton = document.querySelector("#play");
    const speed = document.querySelector("#speed");
    let frame = 0;
    let playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let timer;

    function showFrame(nextFrame) {
      frame = (Number(nextFrame) + frames.length) % frames.length;
      bird.src = frames[frame];
      phase.textContent = phases[frame];
      scrubber.value = frame;
    }

    function schedule() {
      window.clearInterval(timer);
      if (playing) timer = window.setInterval(() => showFrame(frame + 1), Number(speed.value));
      playButton.textContent = playing ? "Pause" : "Flap wings";
      playButton.setAttribute("aria-pressed", String(playing));
      wrap.classList.toggle("paused", !playing);
    }

    playButton.addEventListener("click", () => { playing = !playing; schedule(); });
    scrubber.addEventListener("input", event => {
      playing = false;
      showFrame(event.target.value);
      schedule();
    });
    speed.addEventListener("change", schedule);
    document.addEventListener("keydown", event => {
      if (event.key === " ") { event.preventDefault(); playing = !playing; schedule(); }
    });

    showFrame(0);
    schedule();
  </script>
</body>
</html>
