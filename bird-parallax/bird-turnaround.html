<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8dfcf">
  <title>Blue Bird · 360° Turnaround</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #15233a;
      --muted: #68717f;
      --blue: #1d559f;
      --gold: #d49a2f;
      --paper: #f7f2e8;
      --line: rgba(21, 35, 58, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }

    main {
      display: grid;
      min-height: 100svh;
      grid-template-columns: minmax(250px, .62fr) minmax(0, 1.38fr);
    }

    .intro {
      display: flex;
      padding: clamp(28px, 5vw, 76px);
      border-right: 1px solid var(--line);
      flex-direction: column;
      justify-content: space-between;
      gap: 48px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 7ch;
      margin: 0;
      font: 400 clamp(52px, 6vw, 94px)/.9 Georgia, serif;
      letter-spacing: -.055em;
    }

    .intro-copy {
      max-width: 33ch;
      margin: 24px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .download {
      color: var(--blue);
      font-size: 14px;
      font-weight: 750;
      text-underline-offset: 4px;
    }

    .viewer {
      display: grid;
      min-width: 0;
      padding: clamp(18px, 3vw, 46px);
      background:
        radial-gradient(circle at 70% 18%, rgba(255,255,255,.94), transparent 31%),
        linear-gradient(145deg, #d7e0eb 0%, #eee8dc 57%, #d9ccb7 100%);
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .stage {
      position: relative;
      display: grid;
      min-height: 0;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
    }

    .stage::before {
      position: absolute;
      width: min(62vw, 650px);
      aspect-ratio: 1;
      border: 1px solid rgba(21, 35, 58, .09);
      border-radius: 50%;
      box-shadow: inset 0 0 80px rgba(255,255,255,.35);
      content: "";
      transform: rotateX(69deg) translateY(39%);
    }

    .stage::after {
      position: absolute;
      bottom: 7%;
      width: min(54vw, 520px);
      height: 34px;
      border-radius: 50%;
      background: rgba(28, 42, 61, .13);
      content: "";
      filter: blur(17px);
      z-index: -1;
    }

    #bird-frame {
      display: block;
      width: min(74svh, 100%, 720px);
      max-height: 72svh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 22px 20px rgba(24, 42, 70, .12));
    }

    .view-name {
      position: absolute;
      top: 10px;
      left: 10px;
      display: inline-flex;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 999px;
      color: #526071;
      background: rgba(255,255,255,.5);
      font-size: 12px;
      font-weight: 750;
      backdrop-filter: blur(12px);
    }

    .controls {
      display: grid;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 18px;
      background: rgba(250,248,243,.72);
      box-shadow: 0 14px 40px rgba(45, 52, 64, .08);
      grid-template-columns: auto auto minmax(130px, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(16px);
    }

    .icon-button, .play-button, select {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255,255,255,.78);
      cursor: pointer;
    }

    .icon-button {
      width: 44px;
      font-size: 20px;
    }

    .play-button {
      min-width: 104px;
      padding: 0 16px;
      color: white;
      border-color: #17263d;
      background: #17263d;
      font-weight: 750;
    }

    select { padding: 0 34px 0 12px; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
      cursor: grab;
    }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid rgba(29, 85, 159, .32);
      outline-offset: 2px;
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .intro {
        padding: 36px 22px 24px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      h1 { max-width: none; font-size: clamp(48px, 14vw, 76px); }
      .intro-copy { margin-top: 16px; }
      .viewer { min-height: 70svh; padding: 12px; }
      #bird-frame { width: min(100%, 620px); max-height: 60svh; }
      .controls {
        grid-template-columns: auto auto minmax(0, 1fr) auto;
      }
      .play-button { min-width: 96px; }
      select { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      #bird-frame { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <div>
        <p class="eyebrow">Character study · eight views</p>
        <h1>See every side.</h1>
        <p class="intro-copy">The bird turns around a fixed center, revealing the complete head, wings, back, feet, and flowing tail design.</p>
      </div>
      <a class="download" href="turnaround/blue-bird-turnaround-sheet.png" download>Download the turnaround sheet</a>
    </header>

    <section class="viewer" aria-label="Interactive 360 degree bird turnaround">
      <div class="stage">
        <span class="view-name" id="view-name">Front</span>
        <img id="bird-frame" src="turnaround/frames/bird-000.png" alt="Blue and gold anime bird viewed from the front">
      </div>

      <div class="controls" aria-label="Turnaround controls">
        <button class="icon-button" id="previous" type="button" aria-label="Previous view">&#8249;</button>
        <button class="play-button" id="play" type="button" aria-pressed="true">Pause</button>
        <input id="scrubber" type="range" min="0" max="7" step="1" value="0" aria-label="Bird viewing angle">
        <select id="speed" aria-label="Rotation speed">
          <option value="700">Slow</option>
          <option value="430" selected>Normal</option>
          <option value="240">Fast</option>
        </select>
        <button class="icon-button" id="next" type="button" aria-label="Next view">&#8250;</button>
      </div>
    </section>
  </main>

  <script>
    const frames = Array.from({ length: 8 }, (_, index) =>
      `turnaround/frames/bird-${String(index).padStart(3, "0")}.png`
    );
    const labels = [
      "Front",
      "Front-left · 45°",
      "Left profile · 90°",
      "Back-left · 135°",
      "Back · 180°",
      "Back-right · 225°",
      "Right profile · 270°",
      "Front-right · 315°"
    ];

    frames.forEach(source => { const image = new Image(); image.src = source; });

    const bird = document.querySelector("#bird-frame");
    const name = document.querySelector("#view-name");
    const scrubber = document.querySelector("#scrubber");
    const playButton = document.querySelector("#play");
    const speed = document.querySelector("#speed");
    let frame = 0;
    let playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let timer;

    function showFrame(nextFrame) {
      frame = (Number(nextFrame) + frames.length) % frames.length;
      bird.src = frames[frame];
      bird.alt = `Blue and gold anime bird — ${labels[frame].toLowerCase()} view`;
      name.textContent = labels[frame];
      scrubber.value = frame;
    }

    function schedule() {
      window.clearInterval(timer);
      if (playing) timer = window.setInterval(() => showFrame(frame + 1), Number(speed.value));
      playButton.textContent = playing ? "Pause" : "Rotate";
      playButton.setAttribute("aria-pressed", String(playing));
    }

    function step(amount) {
      showFrame(frame + amount);
      schedule();
    }

    playButton.addEventListener("click", () => { playing = !playing; schedule(); });
    document.querySelector("#previous").addEventListener("click", () => step(-1));
    document.querySelector("#next").addEventListener("click", () => step(1));
    scrubber.addEventListener("input", event => showFrame(event.target.value));
    scrubber.addEventListener("pointerdown", () => { playing = false; schedule(); });
    speed.addEventListener("change", schedule);
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") step(-1);
      if (event.key === "ArrowRight") step(1);
      if (event.key === " ") { event.preventDefault(); playing = !playing; schedule(); }
    });

    showFrame(0);
    schedule();
  </script>
</body>
</html>
