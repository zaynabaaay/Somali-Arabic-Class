<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dbeaf5">
  <meta name="description" content="A cinematic, scroll-led journey through an atmospheric vision of Jannah.">
  <title>Jannah · A Cinematic Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran:wght@400&family=EB+Garamond:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cinematic.css?v=source-text-glow-1">
  <style>
    :root {
      --moon-reveal: 0;
      --moon-y: 4vh;
      --moon-scale: 1.06;
    }

    body,
    body * {
      color: #000 !important;
    }

    .moon-window {
      position: absolute;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      opacity: var(--moon-reveal);
      pointer-events: none;
      will-change: opacity;
    }

    .moon-landscape {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      max-width: none;
      object-fit: cover;
      object-position: center 28%;
      transform: translate3d(0, var(--moon-y), 0) scale(var(--moon-scale));
      transform-origin: center;
      will-change: transform;
    }
  </style>
</head>
<body class="content-review-mode">
  <main class="cinematic-page">
    <section class="sky-scene" id="opening-sky" aria-label="An immense, luminous celestial sky">
      <div class="sky-viewport">
        <img class="sky-background" src="assets/backgrounds/sky/jannah-sky-atmosphere-v1.png" alt="" width="941" height="1672" fetchpriority="high" decoding="async">
        <div class="landscape-window" aria-hidden="true">
          <img class="river-landscape" src="assets/backgrounds/landscape/jannah-river-reveal-v1.png" alt="" width="941" height="1672" decoding="async">
        </div>
        <div class="garden-window" aria-hidden="true">
          <img class="garden-landscape" src="assets/backgrounds/landscape/jannah-shaded-garden-v1.png" alt="" width="1672" height="941" loading="lazy" decoding="async">
        </div>
        <div class="moon-window" aria-hidden="true">
          <img class="moon-landscape" src="../scene-1-3-moon.png" alt="" loading="lazy" decoding="async">
        </div>
        <img class="distant-clouds" src="assets/backgrounds/clouds/distant-clouds-v1.png" alt="" width="941" height="1672" decoding="async">
        <img class="close-clouds" src="assets/backgrounds/clouds/close-clouds-v1.png" alt="" width="941" height="1672" decoding="async">
        <div class="atmosphere" aria-hidden="true"></div>

        <div class="opening-story">
          <section class="story-beat hero-beat" aria-labelledby="jannah-title">
            <div class="hero-lockup">
              <h1 class="hero-arabic" id="jannah-title" lang="ar" dir="rtl">
                <img class="hero-calligraphy" src="assets/calligraphy/jannah-title-calligraphy.svg?v=restore-original-calligraphy-1" alt="الْجَنَّة" width="373" height="306">
              </h1>
              <div class="hero-name-row">
                <span class="hero-ornament" aria-hidden="true"></span>
                <p class="hero-english">Jannah</p>
                <span class="hero-ornament" aria-hidden="true"></span>
              </div>
              <p class="hero-subtitle">The Garden of Paradise</p>
            </div>
          </section>
        </div>

        <p class="scroll-cue" aria-hidden="true"><span></span>Scroll</p>
      </div>
    </section>

    <section class="part-one-content" id="part-one-content" aria-labelledby="part-one-content-title">
      <h2 class="visually-hidden" id="part-one-content-title">Part One · Descriptions of Jannah</h2>
      <div class="part-one-scenes" id="part-one-scenes" aria-live="polite">
        <p class="content-loading">Loading Part One…</p>
      </div>
    </section>

    <section class="part-two-content" id="part-two-content" aria-labelledby="part-two-content-title">
      <h2 class="visually-hidden" id="part-two-content-title">Part Two · The Price</h2>
      <div class="part-two-scenes" id="part-two-scenes" aria-live="polite">
        <p class="content-loading">Loading Part Two…</p>
      </div>
    </section>

    <section class="part-three-content" id="part-three-content" aria-labelledby="part-three-content-title">
      <h2 class="visually-hidden" id="part-three-content-title">Part Three · The Proof</h2>
      <div class="part-three-scenes" id="part-three-scenes" aria-live="polite">
        <p class="content-loading">Loading Part Three…</p>
      </div>
    </section>
  </main>

  <script type="module" src="js/part-one-content.js?v=reference-first-1"></script>
  <script type="module" src="js/part-two-content.js?v=reference-first-1"></script>
  <script type="module" src="js/part-three-content.js?v=reference-first-1"></script>
  <script type="module" src="js/cinematic-scroll.js?v=full-moon-beat-1"></script>
</body>
</html>
