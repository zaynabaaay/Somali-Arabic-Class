<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dbeaf5">
  <meta name="description" content="A cinematic, scroll-led journey through an atmospheric vision of Jannah.">
  <title>Jannah · A Cinematic Journey</title>
  <link rel="preload" href="assets/backgrounds/sky/jannah-sky-atmosphere-v1.png" as="image" fetchpriority="high">
  <link rel="preload" href="assets/backgrounds/landscape/jannah-river-reveal-v1.png" as="image">
  <link rel="preload" href="assets/backgrounds/clouds/distant-clouds-v1.png" as="image">
  <link rel="preload" href="assets/backgrounds/clouds/close-clouds-v1.png" as="image">
  <link rel="stylesheet" href="css/cinematic.css?v=single-river-1">
</head>
<body>
  <main class="cinematic-page">
    <section class="sky-scene" id="opening-sky" aria-label="An immense, luminous celestial sky">
      <div class="sky-viewport">
        <img
          class="sky-background"
          src="assets/backgrounds/sky/jannah-sky-atmosphere-v1.png"
          alt=""
          width="941"
          height="1672"
          fetchpriority="high"
          decoding="async"
        >
        <div class="landscape-window" aria-hidden="true">
          <img
            class="river-landscape"
            src="assets/backgrounds/landscape/jannah-river-reveal-v1.png"
            alt=""
            width="941"
            height="1672"
            decoding="async"
          >
        </div>
        <img
          class="distant-clouds"
          src="assets/backgrounds/clouds/distant-clouds-v1.png"
          alt=""
          width="941"
          height="1672"
          decoding="async"
        >
        <img
          class="close-clouds"
          src="assets/backgrounds/clouds/close-clouds-v1.png"
          alt=""
          width="941"
          height="1672"
          decoding="async"
        >
        <div class="atmosphere" aria-hidden="true"></div>

        <div class="opening-story">
          <section class="story-beat hero-beat" aria-labelledby="jannah-title">
            <div class="hero-lockup">
              <h1 class="hero-arabic" id="jannah-title" lang="ar" dir="rtl">الجَنَّة</h1>
              <p class="hero-english">Jannah</p>
              <p class="hero-subtitle">The Garden of Paradise</p>
            </div>
          </section>

          <section class="story-beat scripture-beat" aria-label="Qur'anic description of Paradise">
            <div class="scripture-opening">
              <p class="scripture-arabic" lang="ar" dir="rtl">مَّثَلُ ٱلْجَنَّةِ ٱلَّتِي وُعِدَ ٱلْمُتَّقُونَ</p>
              <p class="scripture-english">“The description of Paradise promised to the righteous…”</p>
              <p class="scripture-reference">Surah Ar-Ra'd 13:35</p>
            </div>
            <p class="scripture-bridge">“…beneath it rivers flow.”</p>
          </section>
        </div>

        <p class="scroll-cue" aria-hidden="true"><span></span>Scroll</p>
      </div>
    </section>
  </main>

  <script src="js/cinematic-scroll.js?v=single-river-1"></script>
</body>
</html>
