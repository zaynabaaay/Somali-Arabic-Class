<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dbeaf5">
  <meta name="description" content="A cinematic, scroll-led journey through an atmospheric vision of Jannah.">
  <title>Jannah · A Cinematic Journey</title>
  <link rel="preload" href="assets/backgrounds/sky/jannah-sky-atmosphere-v1.png" as="image" fetchpriority="high">
  <link rel="preload" href="assets/backgrounds/clouds/distant-clouds-v1.png" as="image">
  <link rel="stylesheet" href="css/cinematic.css">
</head>
<body>
  <main class="cinematic-page">
    <section class="sky-scene" id="opening-sky" aria-label="An immense, luminous celestial sky">
      <div class="sky-viewport">
        <img
          class="sky-background"
          src="assets/backgrounds/sky/jannah-sky-atmosphere-v1.png"
          alt=""
          width="941"
          height="1672"
          fetchpriority="high"
          decoding="async"
        >
        <img
          class="distant-clouds"
          src="assets/backgrounds/clouds/distant-clouds-v1.png"
          alt=""
          width="941"
          height="1672"
          decoding="async"
        >
        <div class="atmosphere" aria-hidden="true"></div>
        <p class="scroll-cue" aria-hidden="true"><span></span>Scroll</p>
      </div>
    </section>
  </main>

  <script src="js/cinematic-scroll.js"></script>
</body>
</html>
