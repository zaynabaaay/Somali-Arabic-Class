<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traced Anime Bird</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #252a35;
      background: #eeeae1;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    main {
      display: grid;
      min-height: 100svh;
      grid-template-columns: minmax(240px, .55fr) minmax(0, 1.45fr);
    }
    header {
      display: grid;
      align-content: end;
      padding: clamp(32px, 6vw, 88px);
      border-right: 1px solid rgba(37, 42, 53, .14);
    }
    p { max-width: 34ch; color: #666d79; line-height: 1.6; }
    .eyebrow {
      margin: 0 0 20px;
      color: #9c7127;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 400 clamp(52px, 7vw, 104px)/.94 Georgia, serif;
      letter-spacing: -.055em;
    }
    a { color: #173f7e; font-weight: 700; }
    .artboard {
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: clamp(20px, 5vw, 72px);
      background:
        radial-gradient(circle at 70% 20%, rgba(255,255,255,.9), transparent 34%),
        linear-gradient(145deg, #d8dfe9, #f5f1e8 62%, #d9cdb9);
    }
    object {
      display: block;
      width: min(100%, 720px);
      max-height: 88svh;
      filter: drop-shadow(0 24px 25px rgba(31, 47, 74, .13));
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      header { padding: 48px 24px 36px; border-right: 0; }
      .artboard { min-height: 72svh; padding: 20px; }
      object { max-height: 68svh; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Vector trace · transparent SVG</p>
        <h1>Blue &amp;<br>gold bird.</h1>
        <p>A palette-cleaned trace preserving the original anime outlines and decorative feather details.</p>
        <a href="traced-blue-bird.svg" download>Download the SVG</a>
      </div>
    </header>
    <section class="artboard" aria-label="Traced bird preview">
      <object data="traced-blue-bird.svg" type="image/svg+xml">Blue and gold anime bird</object>
    </section>
  </main>
</body>
</html>
